# Packit configuration: https://packit.dev/docs/configuration
#
# This repository is mostly Arch Linux PKGBUILDs. Packages that also carry a
# Fedora spec file are listed under `packages`, each scoped to its folder.
#
# The specs package other projects' release files, so there is no archive to
# create from this repository. Each package's `create-archive` action just
# prints the path of a file already next to the spec (Packit requires one), and
# Packit downloads the spec's remote Source URLs itself. `fix-spec-file` only
# sets Release, leaving Version and the Source URLs as written in the spec.
# Actions run from the package's folder (its first `paths` entry).

upstream_project_url: https://github.com/jm2/archlinux-packages

# rpmspec, for get-current-version
srpm_build_deps:
  - rpm-build

packages:
  openq4-bin:
    paths:
      - ./openq4-bin
    specfile_path: openq4-bin.spec
    upstream_package_name: openq4-bin
    downstream_package_name: openq4-bin
    actions:
      get-current-version:
        - rpmspec -q --srpm --qf "%{version}" openq4-bin.spec
      create-archive:
        - echo openq4.sh
      fix-spec-file:
        - bash -c "sed -i -r \"s/^Release:(\s*)\S+/Release:\1${PACKIT_RPMSPEC_RELEASE}%{?dist}/\" openq4-bin.spec"

jobs:
  # The SRPM carries both architectures' release archives plus the Quake 4
  # point release (about 1.6 GB), so pull request builds only run on request:
  # comment "/packit copr-build" on the pull request.
  - job: copr_build
    trigger: pull_request
    manual_trigger: true
    packages: [openq4-bin]
    targets:
      - fedora-all-x86_64
      - fedora-all-aarch64

  # Publish builds of master to your own Copr project. Create the project,
  # set owner/project below, and grant Packit builder access, see
  # https://packit.dev/docs/configuration/upstream/copr_build#using-a-custom-copr-project
  # - job: copr_build
  #   trigger: commit
  #   branch: master
  #   packages: [openq4-bin]
  #   owner: YOUR_COPR_USERNAME
  #   project: openq4
  #   targets:
  #     - fedora-all-x86_64
  #     - fedora-all-aarch64
